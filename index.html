<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SKIP - YAML × Python ミニアプリフレームワーク</title>

  <!-- SEO -->
  <meta name="description" content="SKIPはYAMLで画面を定義し、Pythonでロジックを書くミニアプリフレームワーク。小さなツールを素早く作れる新しい開発体験。">
  <meta name="keywords" content="SKIP, YAML, Python, ミニアプリ, GUI, skipweb">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1, h2 {
      margin-top: 0;
    }
    .container {
      max-width: 900px;
      margin: auto;
    }
    textarea {
      width: 100%;
      height: 200px;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 14px;
    }
    .output {
      white-space: pre-wrap;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 6px;
      min-height: 150px;
      margin-top: 10px;
      font-family: monospace;
    }
    button {
      background: #4f46e5;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #6366f1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SKIP - YAML × Python ミニアプリフレームワーク</h1>
    <p>SKIPは、画面構成をYAMLで、ロジックをPythonで書くミニアプリフレームワークです。</p>

    <h2>YAML構造ビューア（簡易）</h2>
    <p>※これはGUIを生成するものではありません。SKIPが読み取る構造をテキストで表示するだけの簡易ツールです。</p>

    <textarea id="yamlInput">window:
  title: "HELLO, SKIP!"
  width: 400
  height: 200

layout:
  - type: label
    id: message
    text: "HELLO!"
    align: center

  - type: button
    text: "Click"
    on_click: on_click_hello</textarea>

    <button onclick="parseYAML()">解析する</button>

    <div id="output" class="output">ここに解析結果が表示されます。</div>
  </div>

  <script>
    function parseYAML() {
      const text = document.getElementById("yamlInput").value;
      const lines = text.split(/\r?\n/);
      let out = "";
      let inWindow = false;
      let inLayout = false;

      out += "=== SKIP YAML 構造 ===\n\n";

      for (let raw of lines) {
        const line = raw.trim();
        if (!line) continue;

        if (line.startsWith("window:")) {
          inWindow = true;
          inLayout = false;
          out += "[window]\n";
          continue;
        }
        if (line.startsWith("layout:")) {
          inLayout = true;
          inWindow = false;
          out += "\n[layout]\n";
          continue;
        }

        if (inWindow) {
          out += "  " + line + "\n";
        } else if (inLayout) {
          out += "  " + line + "\n";
        }
      }

      document.getElementById("output").textContent = out;
    }
  </script>
</body>
</html>
